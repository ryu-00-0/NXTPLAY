<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXTPLAY — Sign Up</title>
  <link rel="stylesheet" href="./css/login.css">
</head>

<body>

  <div id="login-page">

    <div id="login-card">

      <div id="login-header">
        <img src="./images/navbarLogo.png" alt="NXTPLAY Logo">
        <p>Create your account and start ordering.</p>
      </div>

      <div id="login-form">

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Enter your full name">
          <span class="field-error" id="fullname-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email">
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="e.g. +63 912 345 6789">
          <span class="field-error" id="phone-error"></span>
        </div>

        <div class="form-group">
          <label for="street">Street Address</label>
          <input type="text" id="street" placeholder="House no., Street, Barangay">
          <span class="field-error" id="street-error"></span>
        </div>

        <div class="form-group">
          <label for="city">City / Municipality</label>
          <input type="text" id="city" placeholder="e.g. Naga City">
          <span class="field-error" id="city-error"></span>
        </div>

        <div class="form-group">
          <label for="zip">ZIP Code</label>
          <input type="text" id="zip" placeholder="e.g. 4400">
          <span class="field-error" id="zip-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password">
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Repeat your password">
          <span class="field-error" id="confirm-error"></span>
        </div>

        <button id="login-btn">Create Account</button>

        <p id="signup-text">Already have an account? <a href="../login.html">Log In</a></p>

      </div>

    </div>

  </div>

  <div id="alert-box" class="hidden">
    <p id="alert-message"></p>
  </div>

  <script src="./js/signup.js"></script>

</body>

</html>
